<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thumb obr</title>
    <link href='https://fonts.googleapis.com/css?family=Nunito' rel='stylesheet'>
    <style>
        p {
            color: white;
            text-shadow: 4px 4px 6px rgba(0,0,0,0.75), 0px 0px 24px white;
        }
        * {
            box-sizing: border-box;
        }
        :root {
            --cor-destaque: #0000ff;
            --cor-destaque-escuro: #000031;
            --cor-destaque-transparente: #000031;
        }

        html, body {
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            font-family: 'Nunito';font-size: 22px;
        }
        body {
            background-size: cover;
            background-color: black;
        }
        #cima {
            display: flex;
            position: relative;
            min-height: 14%;
            justify-content: center;
            align-items: center;
            margin:3%;
            margin-bottom: 6%;
        }
        #baixo {
            display: flex;
            flex-direction: column;
            position: relative;
            height: 86%;
            border-top: 6px solid var(--cor-destaque);
            border-bottom: 6px solid var(--cor-destaque);
            justify-content: center;

        }
        #nome-mapa {
            position: absolute;
            font-size: 68px;
            text-shadow: 4px 4px 2px rgba(0,0,0,0.75), 0px 0px 24px white;
            text-align: center;
        }
        p {
            margin: 0;
        }
        #diff-container {
            align-self: center;
            position:absolute;
            padding:4px 8px;
            background: var(--cor-destaque-escuro);
            border: 6px solid var(--cor-destaque);
            width: fit-content;
            top: -45px;
            color: white;
            border-radius: 12px;
            z-index: 3;
        }
        #meio {
            position:relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-evenly;
            align-items: center;
            backdrop-filter: blur(10px);
            background-color: rgba(0,0,0,0.5);
        }
        #meio-meio {
            display: flex;
            flex-direction: column;
            width: 100%;
            justify-content: center;
            align-items: center;
        }

        #meio-meio-meio {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        
        #diff {
            font-size: 48px;
        }



        #pfp {
            align-self: center;
            justify-self: center;
            width: 256px;
            height: 256px;
            border: 6px solid var(--cor-destaque);
            border-radius: 48px;
        }

        #esquerda-meio, #direita-meio {
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 48px;
            gap:30px;

        }

        #esquerda-meio {
            right: 50%;
            text-align: left;
            margin-right: 160px;
        }

        #direita-meio {
            left: 50%;
            margin-left: 160px;
        }
        #nickname {
            font-size: 64px;
            top: 72px;
            padding-top: 1rem;
        }
        #desc {
            text-align: right;
        }
        #card-meio {
            position: absolute;
            right: 0;
            padding:24px;
            font-size: 48px;
            border-left: 6px solid var(--cor-destaque);
            border-radius: 24px 0px 0px 24px;
            color: white;

            background-color: var(--cor-destaque-transparente);
        }
        #grade {
            position: absolute;
            left: 3%;
            font-size: 300px;
            font-weight: 1000;

        }
        #obs {
            bottom: 24px;
            font-size: 64px;
        }

        /* #popup-container {
            position:absolute;
            display:flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        #popup {
            display: flex;
            flex-direction: column;
            gap:1rem;
            background-color:white;
            padding:4rem;
            box-shadow: 0px 0px 10px 1px rgba(0,0,0,0.1);
            z-index: 2;
            border-radius: 0.5rem;
        } */
    </style>
    <script>
        window.onload = () => {
            const params = new Proxy(new URLSearchParams(window.location.search), {
                get: (searchParams, prop) => searchParams.get(prop),
            });
            // Get the value of "some_key" in eg "https://example.com/?some_key=some_value"
            document.querySelector("#nome-mapa").textContent = params.mapa
            document.querySelector("#nickname").textContent = params.nickname
            document.querySelector("#obs").textContent = params.obs
            document.querySelector("#acc").textContent = params.acc
            document.querySelector("#mods").textContent = params.mods
            document.querySelector("#pp").textContent = params.pp
            document.querySelector("#max-combo").textContent = params.combo
            document.querySelector("#star-rating").textContent = params.sr
            document.querySelector("#diff").textContent = params.diff
            const bgUrl = `file:///${params.bg}`;
            document.querySelector("#bg-image").src = `${bgUrl}`
            document.querySelector("#pfp").style.backgroundImage = `url("${params.pfp}")`
            document.querySelector("#grade").textContent = params.grade

            // Choose grade color
            gradeColor = "white";
            if ((params.grade === "SS" || params.grade === "S") && (params.mods.includes("HD"))) {
                gradeColor = "white";
            } else if (params.grade === "SS" || params.grade === "S") {
                gradeColor = "rgb(255, 229, 196)"
            } else if (params.grade === "A") {
                gradeColor = "rgb(196, 255, 205)"
            } else if (params.grade === "B") {
                gradeColor = "rgb(144, 160, 247)"
            } else if (params.grade === "C") {
                gradeColor = "rgb(255, 160, 132)"
            } else {
                gradeColor = "rgb(172, 12, 12)"
            }

            document.querySelector("#grade").style.color = gradeColor;
            if (params.grade == "SS") {
                document.querySelector("#grade").letterSpacing = "-50px"
            }

            const img = document.querySelector("#bg-image");

            // Get dominant color from background
            if (img.complete) {
                getDominantColor(img);
            } else {
                img.onload = () => getDominantColor(img);
            }

            // Choose right color for desc
            document.querySelector("#desc").textContent = params.desc
            if (params.desc.includes("x")) {
                document.querySelector("#desc").style.color = "#fd9e9e"
            } else if (params.desc.includes("sb")) {
                document.querySelector("#desc").style.color = "#819bff"
            } else if (params.desc.trim() === "" && (params.grade === "S" || params.grade === "SS")) {
                document.querySelector("#desc").textContent = "FC"
                document.querySelector("#desc").style.color = "rgb(255, 229, 196)"
            }
        }

        
        function getDominantColor(image) {
            // Create a canvas and draw the image
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = image.width;
            canvas.height = image.height;
            ctx.drawImage(image, 0, 0);

            // Get the image data
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            // Count colors
            const colorMap = {};
            let maxCount = 0;
            let dominantColor = "${50},${50},${50}";

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const key = `${r},${g},${b}`;
                
                // Skip white and black
                if (Math.abs(r - g) <= 30 && Math.abs(r - b) <= 30 && Math.abs(g - b) <= 30) {
                    continue; // Skip white and black pixels
                }
                
                if (Math.abs(r - g) > 100 && Math.abs(r - b) > 100 && Math.abs(g - b) > 100) {
                    continue
                }

                colorMap[key] = (colorMap[key] || 0) + 1;

                if (colorMap[key] > maxCount) {
                    maxCount = colorMap[key];
                    dominantColor = key;
                }
            }
            const [r, g, b] = dominantColor.split(",").map(Number);

            // Display the dominant color
            document.documentElement.style.setProperty('--cor-destaque', `rgb(${dominantColor})`);
            document.documentElement.style.setProperty('--cor-destaque-escuro', `rgb(${Math.max(r * 0.2, 0)}, ${Math.max(g * 0.2, 0)}, ${Math.max(b * 0.2, 0)})`);
            document.documentElement.style.setProperty('--cor-destaque-transparente', `rgba(${dominantColor}, 0.25)`);

        }
    </script>
</head>
<body>
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="bg-image" style="position: absolute; width: 100%; height: 100%; object-fit: cover; background-size: cover;"/>
    <header id="cima">
        <p id="nome-mapa">Nome Mapa</p>
    </header>

        <div id="popup">
            <p>
                arquivo de replay
            </p>
            <input id="replay-file-input" type="file" accept=".osr">
        </div>
    </div> -->
    <div id="baixo">
        <div id="diff-container">
            <p id="diff">[diff]</p>
        </div>
        <div id="meio">
            <p id="nickname">Nome Jogador</p>
            <div id="meio-meio">
                
                    <div id="meio-meio-meio">
                        <p id="grade">SS</p>
                        <div id="esquerda-meio">
                            <p id="pp">30pp</p>
                            <p id="desc">1sb</p>
                        </div>
                        <div id="pfp">
        
                        </div>
                        <div id="direita-meio">
                            <p id="acc">100.00%</p>
                            <p id="mods">+hr</p>
                        </div>
                    </div>
            </div>
            <div id="card-meio">
                <p id="star-rating">10.00 ⭐</p>
                <p id="max-combo">100x</p>
            </div>
            <p id="obs">Descricao</p>
        </div>
    </div>
</body>
</html>
